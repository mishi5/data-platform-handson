version: 2

models:
  - name: mart_url_performance
    description: "URL別パフォーマンス分析テーブル"
    columns:
      - name: url_path
        description: "URLパス"
        tests:
          - not_null
      
      - name: date
        description: "集計日"
        tests:
          - not_null
      
      - name: total_requests
        description: "総リクエスト数"
        tests:
          - not_null
      
      - name: error_rate_percent
        description: "エラー率（%）"
        tests:
          - not_null

  - name: mart_error_analysis
    description: "エラー分析テーブル"
    columns:
      - name: date
        description: "発生日"
        tests:
          - not_null
      
      - name: error_source
        description: "エラーソース"
        tests:
          - accepted_values:
              values: ['app_error', 'http_error']
      
      - name: error_count
        description: "エラー件数"
        tests:
          - not_null