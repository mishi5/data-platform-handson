name: 'dbt_logs_analysis'
version: '1.0.0'
config-version: 2

profile: 'dbt_logs_analysis'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_logs_analysis:
    # Stagingモデル: ビュー（軽量、再計算が速い）
    staging:
      +materialized: view
      +schema: staging
    
    # Martsモデル: テーブル（パフォーマンス重視）
    marts:
      +materialized: table
      +schema: marts